<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Contact</title>
<style>
:root{--bg:#f7f5f2;--card:#fff;--ink:#1d2433;--muted:#5a6375;--line:#ddd6cc;--accent:#5b3cc4;--ok:#16704a;--err:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#111827;--card:#1c2333;--ink:#f3f4f6;--muted:#b6bcc8;--line:#2e3646;--accent:#a996f2;--ok:#5fd39a;--err:#f97066}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:32px 16px}
h1{font-size:1.6rem;margin:0 0 4px}p.sub{color:var(--muted);margin:0 0 20px}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
label{font-weight:600;display:flex;flex-direction:column;gap:6px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:150px;resize:vertical}
button{font:inherit;font-weight:700;color:#fff;background:var(--accent);border:0;border-radius:10px;min-height:48px;cursor:pointer}
button[disabled]{opacity:.6}.hint{color:var(--muted);font-size:.9rem;font-weight:400}
.msg{border-radius:10px;padding:12px;border:1px solid var(--line)}.ok{border-color:var(--ok)}.err{border-color:var(--err)}
.hp{position:absolute;left:-9999px}
</style>
</head>
<body>
<main>
<h1 id="title">Contact</h1>
<p class="sub" id="sub"></p>
<form id="f" novalidate>
<label><span id="l-topic"></span><select id="topic" required></select></label>
<label><span id="l-email"></span><input id="email" type="email" autocomplete="email" maxlength="254" required><span class="hint" id="h-email"></span></label>
<label><span id="l-message"></span><textarea id="message" minlength="10" maxlength="3000" required></textarea></label>
<label class="hp" aria-hidden="true">Website<input id="website" tabindex="-1" autocomplete="off"></label>
<div id="status" role="status" aria-live="polite"></div>
<button id="send" type="submit"></button>
</form>
</main>
<script>
// Formulaire de contact commun du portefeuille (14/10/2026) : jamais d'adresse e-mail de l'éditeur publiée.
// Écriture seule dans Firestore (projet mythadubiz-apps, europe-west1) ; règles : champs validés, aucune lecture publique.
const KEY = "AIzaSyBe7yPqfClmiey-qmjENhchASqGUhDLuNk";
const URL_ = "https://firestore.googleapis.com/v1/projects/mythadubiz-apps/databases/(default)/documents/contactMessages?key=" + KEY;
const APPS = {"admob-reporting": "Mythadubiz AdMob Reporting", "bramsort": "Bramsort", "camille-astronaut": "Camille Astronaut", "camille-horses": "Camille and the horses", "camille-krabi": "Camille in Krabi", "camille-martinique": "Camille in Martinique", "camille-newyork": "Camille in New York", "camille-paris": "Camille in Paris", "camille-vietnam": "Camille in Vietnam", "celar": "Celar", "cellalonga": "CellaLonga", "coachdeck": "CoachDeck", "cutwave": "Cutwave", "diggerjones": "Digger Jones", "englishvocab": "EnglishVocab", "fleur-de-lune": "Fleur de Lune", "gardengridquest": "Garden Grid Quest", "icebrek": "IceBrek", "manna": "Manna", "memorytrack": "MemoryTrack", "morniva": "Morniva", "mosselia": "Mosselia", "nameday": "NameDay", "pitiwee": "Pitiwee", "quickpair": "Quick Pair", "revealix": "Revealix", "runz": "RunZ", "shotloop": "Shot Loop", "thai-reader": "Thai Reader", "thaiin3days": "ThaiIn3Days", "thaivocab": "ThaiVocab", "theopener": "The Opener", "totaltimemeet": "Total Time Meet", "wordlardox": "Word Lardox"};
const T = {
  en: {title: "Contact", sub: a => a ? `Questions about ${a}? Write to us here.` : "Questions about one of our apps? Write to us here.", topic: "Subject", topics: {support: "Help with the app", privacy: "Privacy or data request", other: "Other"}, email: "Your email address", hint: "Used only to reply to you.", message: "Your message", send: "Send", sending: "Sending…", ok: "Thank you, your message has been sent. We will reply to the address you gave.", bad: "Please enter a valid email address and a message of at least 10 characters.", fail: "The message could not be sent. Please try again in a moment."},
  fr: {title: "Contact", sub: a => a ? `Une question sur ${a} ? Écrivez-nous ici.` : "Une question sur l'une de nos apps ? Écrivez-nous ici.", topic: "Sujet", topics: {support: "Aide sur l'app", privacy: "Confidentialité ou demande sur vos données", other: "Autre"}, email: "Votre adresse e-mail", hint: "Utilisée uniquement pour vous répondre.", message: "Votre message", send: "Envoyer", sending: "Envoi…", ok: "Merci, votre message est envoyé. Nous vous répondrons à l'adresse indiquée.", bad: "Indiquez une adresse e-mail valide et un message d'au moins 10 caractères.", fail: "Le message n'a pas pu être envoyé. Réessayez dans un instant."},
  de: {title: "Kontakt", sub: a => a ? `Fragen zu ${a}? Schreiben Sie uns hier.` : "Fragen zu einer unserer Apps? Schreiben Sie uns hier.", topic: "Betreff", topics: {support: "Hilfe zur App", privacy: "Datenschutz oder Anfrage zu Ihren Daten", other: "Sonstiges"}, email: "Ihre E-Mail-Adresse", hint: "Wird nur verwendet, um Ihnen zu antworten.", message: "Ihre Nachricht", send: "Senden", sending: "Wird gesendet…", ok: "Vielen Dank, Ihre Nachricht wurde gesendet. Wir antworten an die angegebene Adresse.", bad: "Bitte geben Sie eine gültige E-Mail-Adresse und eine Nachricht mit mindestens 10 Zeichen ein.", fail: "Die Nachricht konnte nicht gesendet werden. Bitte versuchen Sie es gleich noch einmal."}
};
const q = new URLSearchParams(location.search);
const app = /^[a-z0-9-]{2,40}$/.test(q.get("app") || "") ? q.get("app") : "general";
const lang = ["fr", "en", "de"].includes(q.get("lang")) ? q.get("lang") : (["fr", "de"].includes((navigator.language || "en").slice(0, 2)) ? navigator.language.slice(0, 2) : "en");
const t = T[lang], name = APPS[app] || "";
document.documentElement.lang = lang;
document.title = name ? `${t.title} — ${name}` : t.title;
const $ = id => document.getElementById(id);
$("title").textContent = name ? `${t.title} — ${name}` : t.title;
$("sub").textContent = t.sub(name);
$("l-topic").textContent = t.topic; $("l-email").textContent = t.email; $("h-email").textContent = t.hint; $("l-message").textContent = t.message; $("send").textContent = t.send;
const pre = ["support", "privacy", "other"].includes(q.get("topic")) ? q.get("topic") : "support";
for (const [v, label] of Object.entries(t.topics)) { const o = document.createElement("option"); o.value = v; o.textContent = label; o.selected = v === pre; $("topic").append(o); }
const say = (text, cls) => { $("status").className = "msg " + cls; $("status").textContent = text; };
$("f").addEventListener("submit", async e => {
  e.preventDefault();
  if ($("website").value) return; // pot de miel : les robots remplissent le champ caché
  const email = $("email").value.trim(), message = $("message").value.trim();
  if (!/^[^@ ]+@[^@ ]+[.][^@ ]+$/.test(email) || message.length < 10) return say(t.bad, "err");
  $("send").disabled = true; $("send").textContent = t.sending;
  const s = v => ({stringValue: v});
  try {
    const r = await fetch(URL_, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({fields: {app: s(app), lang: s(lang), email: s(email), message: s(message.slice(0, 3000)), topic: s($("topic").value), page: s((document.referrer || "").slice(0, 200))}})});
    if (!r.ok) throw new Error(String(r.status));
    $("f").replaceChildren(Object.assign(document.createElement("p"), {className: "msg ok", textContent: t.ok}));
  } catch { say(t.fail, "err"); $("send").disabled = false; $("send").textContent = t.send; }
});
</script>
</body>
</html>
